<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ease — Interaction Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFBFA; --card:#FFFFFF; --ink:#111214; --sub:#6B6B68; --muted:#A2A29E;
    --line:#EAEAE6; --line-strong:#DFDFDA;
    --orange1:#FFB259; --orange2:#FF6A00;
    --orange-grad:linear-gradient(135deg,#FFB259 0%,#FF7A1A 55%,#FF5E00 100%);
    --heart:#FF4D4D; --radius:0px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--ink);color:#fff}
  button{font-family:inherit}

  /* ---------- top bar ---------- */
  header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:20px;padding:16px 30px;background:rgba(251,251,250,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .wordmark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.04em;user-select:none;display:flex;align-items:center;gap:2px}
  .wordmark b{color:var(--ink)}
  .wordmark .o{width:16px;height:16px;border-radius:50%;background:var(--orange-grad);display:inline-block;margin:0 1px;transform:translateY(2px)}
  header .spacer{flex:1}
  .hbtn{font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:99px;padding:8px 16px;transition:background .15s,color .15s,transform .1s}
  .hbtn:hover{background:var(--ink);color:#fff}
  .hbtn:active{transform:scale(.97)}
  .hbtn.solid{background:var(--ink);color:#fff}
  .hbtn.solid:hover{background:#000}
  .iconbtn{width:38px;height:38px;border-radius:99px;border:1px solid var(--line-strong);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:border .15s,transform .1s}
  .iconbtn:hover{border-color:var(--ink)}
  .iconbtn:active{transform:scale(.95)}
  .iconbtn svg{width:16px;height:16px}
  .owner-only{display:none}
  body.is-owner .owner-only{display:inline-flex}
  .owner-badge{display:none;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--orange2);border:1px solid var(--orange1);border-radius:99px;padding:5px 11px}
  body.is-owner .owner-badge{display:inline-flex}
  .owner-badge .d{width:7px;height:7px;border-radius:50%;background:var(--orange-grad)}

  /* ---------- sub bar ---------- */
  .subbar{display:flex;align-items:baseline;gap:14px;padding:22px 30px 4px}
  .crumb{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--sub);letter-spacing:.01em}
  .crumb b{color:var(--ink);font-weight:500}
  .subbar .spacer{flex:1}
  .stat{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}

  /* ---------- filters ---------- */
  .filters{display:flex;gap:9px;flex-wrap:wrap;padding:14px 30px 20px}
  .chip{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--line-strong);background:#fff;color:var(--ink);border-radius:99px;padding:7px 15px;transition:border .15s,box-shadow .15s,transform .1s}
  .chip img{width:17px;height:17px;border-radius:4px;object-fit:cover}
  .chip .cnt{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
  .chip:hover{border-color:var(--ink)}
  .chip:active{transform:scale(.97)}
  .chip.active{border-color:var(--ink);background:var(--ink);color:#fff}
  .chip.active .cnt{color:rgba(255,255,255,.6)}
  /* Pop is always first + orange */
  .chip.pop{border:none;color:#fff;background:var(--orange-grad);font-weight:600;box-shadow:0 4px 14px -4px rgba(255,106,0,.6)}
  .chip.pop svg{width:14px;height:14px;fill:#fff}
  .chip.pop .cnt{color:rgba(255,255,255,.75)}
  .chip.pop.active{box-shadow:0 6px 18px -4px rgba(255,106,0,.75), inset 0 0 0 2px rgba(255,255,255,.35)}

  /* ---------- ruled grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);margin:0 30px 70px}
  .cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:34px 22px 20px;display:flex;flex-direction:column;align-items:center;min-height:420px;position:relative;transition:background .2s}
  .cell:hover{background:#fff}
  .stage{position:relative;cursor:pointer;display:flex;justify-content:center;width:100%}
  .phone{position:relative;width:158px;aspect-ratio:9/19.5;background:#000;border-radius:26px;border:5px solid #0c0c0e;box-shadow:0 18px 34px -18px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.08);overflow:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .cell:hover .phone{transform:translateY(-4px)}
  .phone video{width:100%;height:100%;object-fit:cover;display:block;background:#0b0c0d}
  .island{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:30%;height:12px;border-radius:99px;background:#000;z-index:3}
  .hoverplay{position:absolute;inset:0;margin:auto;width:44px;height:44px;border-radius:50%;background:rgba(17,18,20,.5);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;z-index:4;opacity:0;transition:opacity .2s;pointer-events:none}
  .stage:hover .hoverplay{opacity:1}
  .hoverplay svg{width:16px;height:16px;fill:#fff;margin-left:2px}
  .stage.previewing .hoverplay{opacity:0}
  .cellfoot{width:100%;margin-top:18px;display:flex;flex-direction:column;gap:6px}
  .cf-app{display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.03em}
  .cf-app img{width:16px;height:16px;border-radius:4px;object-fit:cover}
  .cf-app .fallback{width:16px;height:16px;border-radius:4px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
  .cf-title{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.25;display:flex;align-items:flex-start;gap:8px}
  .cf-title span{flex:1}
  .cf-like{display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);flex-shrink:0}
  .cf-like svg{width:12px;height:12px;fill:none;stroke:var(--muted);stroke-width:1.8}
  .cf-like.liked svg{fill:var(--heart);stroke:var(--heart)}
  .cf-like.liked{color:var(--heart)}

  .empty,.loading{grid-column:1/-1;text-align:center;color:var(--muted);padding:90px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .empty h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:24px;letter-spacing:-.02em;color:var(--ink);margin-bottom:10px}
  .loading{font-family:'JetBrains Mono',monospace;font-size:12px}

  /* ---------- overlay sheets ---------- */
  .overlay{position:fixed;inset:0;z-index:100;background:rgba(17,18,20,.6);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:24px;animation:fade .2s ease}
  .overlay.open{display:flex}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:var(--card);border-radius:20px;width:min(430px,100%);padding:28px;box-shadow:0 40px 80px -30px rgba(0,0,0,.5);animation:rise .25s cubic-bezier(.2,.9,.3,1.1);max-height:92vh;overflow:auto}
  @keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:21px;letter-spacing:-.02em;margin-bottom:6px}
  .sheet .sub{color:var(--sub);font-size:13px;margin-bottom:20px}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
  .field input{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line-strong);border-radius:11px;background:var(--paper);outline:none;transition:border .15s}
  .field input:focus{border-color:var(--ink)}
  .filedrop{border:1.5px dashed var(--line-strong);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border .15s,background .15s;background:var(--paper)}
  .filedrop:hover,.filedrop.dragover{border-color:var(--ink);background:#fff}
  .filedrop .thumb{width:44px;height:44px;border-radius:10px;background:#fff;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;font-size:18px}
  .filedrop .thumb img,.filedrop .thumb video{width:100%;height:100%;object-fit:cover}
  .filedrop .meta{min-width:0}
  .filedrop .meta strong{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .filedrop .meta span{font-size:12px;color:var(--muted)}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
  .btn{font:inherit;font-weight:600;font-size:14px;cursor:pointer;border:1px solid var(--ink);border-radius:11px;padding:10px 18px;transition:transform .1s,background .15s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.primary:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:#fff;color:var(--ink)}
  .prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:16px;display:none}
  .prog.show{display:block}
  .prog i{display:block;height:100%;width:20%;background:var(--orange-grad);transition:width .3s}
  .hint{font-size:12px;color:var(--sub);line-height:1.5;margin-top:14px;padding:10px 12px;background:var(--paper);border-radius:10px}

  /* ---------- lightbox / player ---------- */
  #lightbox .overlay-inner{display:flex;gap:40px;align-items:center;justify-content:center;width:100%;max-width:900px;flex-wrap:wrap}
  .player-stage{display:flex;flex-direction:column;align-items:center;gap:16px}
  .player-stage:fullscreen{background:#0a0a0b;justify-content:center;padding:24px}
  .lightbox-phone{position:relative;width:min(300px,74vw);aspect-ratio:9/19.5;background:#000;border-radius:42px;border:7px solid #0c0c0e;box-shadow:0 40px 90px -30px rgba(0,0,0,.7);overflow:hidden}
  .player-stage:fullscreen .lightbox-phone{width:auto;height:88vh}
  .lightbox-phone video{width:100%;height:100%;object-fit:cover}
  .lightbox-phone .island{top:10px;height:16px}
  /* control bar (image-2 style pill) */
  .player{display:flex;align-items:center;gap:12px;background:rgba(238,238,236,.92);backdrop-filter:blur(10px);border:1px solid rgba(0,0,0,.06);border-radius:16px;padding:9px 14px;width:min(300px,74vw);box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}
  .player button{width:26px;height:26px;border:none;background:transparent;cursor:pointer;color:#1b1b1d;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
  .player button svg{width:18px;height:18px;fill:#1b1b1d}
  .player button:hover{color:#000}
  .player .scrub{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:99px;background:#c9c9c6;outline:none;cursor:pointer}
  .player .scrub::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#1b1b1d;cursor:pointer}
  .player .scrub::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:#1b1b1d;cursor:pointer}
  .player .vol{width:52px;-webkit-appearance:none;appearance:none;height:4px;border-radius:99px;background:#c9c9c6;outline:none;cursor:pointer}
  .player .vol::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#1b1b1d;cursor:pointer}
  .player .vol::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;background:#1b1b1d;cursor:pointer}
  .player .spd{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;width:auto;padding:0 4px;color:#1b1b1d}
  .player .spd.on{color:var(--orange2)}
  .player .lp.on svg{fill:var(--orange2)}
  .ptime{font-family:'JetBrains Mono',monospace;font-size:10px;color:#6b6b68;flex-shrink:0;min-width:64px;text-align:center}

  .lightbox-info{color:#fff;min-width:230px;max-width:300px;display:flex;flex-direction:column;gap:16px}
  .lightbox-info .approw{display:flex;align-items:center;gap:11px}
  .lightbox-info .approw img{width:36px;height:36px;border-radius:9px;object-fit:cover}
  .lightbox-info .approw .fallback{width:36px;height:36px;border-radius:9px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Space Grotesk',sans-serif}
  .lightbox-info .approw span{font-weight:600;font-size:15px}
  .lightbox-info h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:26px;letter-spacing:-.02em;line-height:1.15}
  .lightbox-info .meta{font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(255,255,255,.55);line-height:1.6}
  .lb-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:2px}
  .lb-btn{display:flex;align-items:center;gap:7px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;border-radius:11px;padding:9px 14px;transition:background .15s,transform .1s}
  .lb-btn:hover{background:rgba(255,255,255,.18)}
  .lb-btn:active{transform:scale(.96)}
  .lb-btn svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:1.9}
  .lb-btn.liked{border-color:var(--heart);color:#ff8a8a}
  .lb-btn.liked svg{fill:var(--heart);stroke:var(--heart)}
  .lb-btn.danger{border-color:rgba(255,110,100,.5);color:#ff8f86}
  .lb-btn.danger:hover{background:rgba(255,77,77,.16)}
  .lightbox-close{position:absolute;top:22px;right:26px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);cursor:pointer;background:rgba(255,255,255,.1);color:#fff;font-size:17px;transition:background .15s,transform .15s;z-index:5}
  .lightbox-close:hover{background:rgba(255,255,255,.22);transform:rotate(90deg)}
  .navarrow{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;transition:background .15s}
  .navarrow:hover{background:rgba(255,255,255,.2)}
  .navarrow svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2}
  .navarrow.prev{left:24px}.navarrow.next{right:24px}
  @media (max-width:720px){.navarrow{display:none}}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-weight:500;font-size:13px;padding:12px 20px;border-radius:12px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 12px 30px rgba(0,0,0,.35);max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .setup{max-width:620px;margin:60px auto;padding:0 24px}
  .setup h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px;letter-spacing:-.03em;margin-bottom:8px}
  .setup .lede{color:var(--sub);font-size:15px;line-height:1.6;margin-bottom:24px}
  .setup pre{background:var(--ink);color:#eee;border-radius:12px;padding:16px;overflow:auto;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.5;white-space:pre}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:1100px){.grid{--cols:3}}
  @media (max-width:820px){.grid{--cols:2}.subbar,.filters,.grid,header{padding-left:16px;padding-right:16px}.grid{margin-left:16px;margin-right:16px}}
  @media (max-width:520px){.grid{--cols:1}}
</style>
</head>

const shell = `

        <input type="file" id="fIcon" accept="image/*" hidden></div></div>
    <div class="field" id="videoField"><label>Screen recording</label>
      <div class="filedrop" id="videoDrop"><div class="thumb" id="videoThumb">🎬</div>
        <div class="meta"><strong id="videoName">Choose a video</strong><span id="videoHint">MP4 / WebM / MOV · up to ${MAX_MB} MB</span></div>
        <input type="file" id="fVideo" accept="video/*" hidden></div></div>
    <div class="prog" id="prog"><i></i></div>
    <div class="actions"><button class="btn ghost" id="cancelUpload">Cancel</button>
      <button class="btn primary" id="saveBtn">Save</button></div>
  </div></div>

  <div class="overlay" id="authOverlay"><div class="sheet">
    <h2>Owner sign in</h2>
    <div class="sub">Only the owner can add, edit, or delete. Everyone else browses freely.</div>
    <div class="field"><label>Email</label><input type="text" id="authEmail" placeholder="you@email.com"></div>
    <div class="field"><label>Password</label><input type="password" id="authPass" placeholder="••••••••"></div>
    <div class="actions"><button class="btn ghost" id="cancelAuth">Cancel</button>
      <button class="btn primary" id="doAuth">Sign in</button></div>
  </div></div>

  <div class="overlay" id="lightbox">
    <button class="lightbox-close" id="lbClose">✕</button>
    <button class="navarrow prev" id="lbPrev">${IC.prev}</button>
    <button class="navarrow next" id="lbNext">${IC.next}</button>
    <div class="overlay-inner">
      <div class="player-stage" id="playerStage">
        <div class="lightbox-phone"><div class="island"></div><video id="lbVideo" playsinline></video></div>
        <div class="player">
          <button id="pPlay">${IC.pause}</button>
          <input type="range" class="scrub" id="pScrub" min="0" max="1000" value="0">
          <span class="ptime" id="pTime">0:00 / 0:00</span>
          <button id="pMute">${IC.vol}</button>
          <input type="range" class="vol" id="pVol" min="0" max="1" step="0.05" value="1">
          <button class="spd" id="pSpeed">1×</button>
          <button class="lp" id="pLoop">${IC.loop}</button>
          <button id="pFull">${IC.full}</button>
        </div>
      </div>
      <div class="lightbox-info">
        <div class="approw" id="lbApp"></div>
        <h2 id="lbTitle"></h2>
        <div class="meta" id="lbMeta"></div>
        <div class="lb-actions">
          <button class="lb-btn" id="lbLike">${IC.heart}<span id="lbLikeCount">0</span></button>
          <button class="lb-btn" id="lbCopy">${IC.link}Copy link</button>
          <button class="lb-btn owner-only" id="lbEdit">${IC.edit}Edit</button>
          <button class="lb-btn danger owner-only" id="lbDelete">${IC.trash}Delete</button>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>`;

/* ===== bootstrap ===== */
const configured = SUPABASE_URL.includes('.supabase.co') && !SUPABASE_URL.includes('YOUR-PROJECT') && SUPABASE_ANON_KEY.length>20;
if(!configured){
  app.innerHTML = `<div class="setup"><h1>Ease</h1><p class="lede">Add your Supabase URL and anon key near the top of this file, then reload.</p></div>`;
} else {
  app.innerHTML = shell;
  run();
}

function run(){
  const $ = id => document.getElementById(id);
  const grid=$('grid'), filters=$('filters');
  let items=[], filter={type:'pop'}, isOwner=false, editingId=null;
  let order=[], lbIndex=-1, currentLB=null;

  let toastT; const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3000);};
  const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const initial=a=>(a||'?').trim().charAt(0).toUpperCase();
  const t2=n=>{n=Math.max(0,n|0);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0');};
  const fileToDataURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(0);r.readAsDataURL(f);});
  const resizeIcon=f=>new Promise(res=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d');const s=Math.min(i.width,i.height);x.drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,96,96);res(c.toDataURL('image/png'));};i.onerror=()=>res(null);fileToDataURL(f).then(u=>i.src=u).catch(()=>res(null));});
  const probeDur=url=>new Promise(res=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>res(v.duration);v.onerror=()=>res(null);v.src=url;});

  /* ---- auth ---- */
  async function refreshAuth(){
    const { data:{ session } } = await supabase.auth.getSession();
    isOwner = !!session;
    document.body.classList.toggle('is-owner', isOwner);
    $('authBtn').title = isOwner ? 'Sign out' : 'Sign in';
    $('authBtn').style.borderColor = isOwner ? 'var(--orange1)' : '';
  }
  $('authBtn').onclick = async ()=>{
    if(isOwner){ await supabase.auth.signOut(); await refreshAuth(); render(); toast('Signed out'); }
    else $('authOverlay').classList.add('open');
  };
  $('cancelAuth').onclick=()=>$('authOverlay').classList.remove('open');
  $('doAuth').onclick=async()=>{
    const email=$('authEmail').value.trim(), password=$('authPass').value;
    if(!email||!password){toast('Enter email and password');return;}
    $('doAuth').disabled=true;$('doAuth').textContent='Signing in…';
    const { error } = await supabase.auth.signInWithPassword({email,password});
    $('doAuth').disabled=false;$('doAuth').textContent='Sign in';
    if(error){toast(error.message);return;}
    $('authOverlay').classList.remove('open');$('authEmail').value='';$('authPass').value='';
    await refreshAuth(); render(); toast('Signed in — owner mode');
  };

  /* ---- data ---- */
  async function load(){
    const { data, error } = await supabase.from('interactions').select('*').order('created_at',{ascending:false});
    if(error){ grid.innerHTML=`<div class="empty"><h2>Couldn't reach the database</h2><p>${esc(error.message)}</p></div>`; return; }
    items=(data||[]).map(r=>({id:r.id,title:r.title,app:r.app,icon:r.icon,video:r.video_url,video_path:r.video_path,duration:r.duration,likes:r.likes||0,createdAt:new Date(r.created_at).getTime()}));
    render();
    const want=new URLSearchParams(location.search).get('i');
    if(want){ const it=items.find(x=>x.id===want); if(it) openLightbox(it); }
  }

  async function toggleLike(item){
    const liked=likedSet.has(item.id), up=!liked;
    item.likes=Math.max(0,item.likes+(up?1:-1));
    if(up) likedSet.add(item.id); else likedSet.delete(item.id);
    store.set('ease:liked',[...likedSet]);
    render(); if(currentLB&&currentLB.id===item.id) paintLikeBtn(item);
    const { error } = await supabase.rpc('like_interaction',{clip_id:item.id,up});
    if(error) toast('Like needs the SQL function — see setup notes');
  }

  /* ---- render ---- */
  function orderedItems(){
    let list=[...items];
    if(filter.type==='pop') list.sort((a,b)=>b.likes-a.likes||b.createdAt-a.createdAt);
    else if(filter.type==='app') list=list.filter(i=>i.app===filter.app);
    return list;
  }
  function render(){
    const apps=[...new Set(items.map(i=>i.app))].sort();
    // filters — Pop always first + orange
    filters.innerHTML='';
    const chip=(label,active,cls,html,onClick)=>{const b=document.createElement('button');b.className='chip'+(cls?' '+cls:'')+(active?' active':'');b.innerHTML=html;b.onclick=onClick;filters.appendChild(b);};
    chip('Pop',filter.type==='pop','pop',`${IC.star}Pop`,()=>{filter={type:'pop'};render();});
    chip('All',filter.type==='all','',`All <span class="cnt">${items.length}</span>`,()=>{filter={type:'all'};render();});
    apps.forEach(a=>{const w=items.find(i=>i.app===a&&i.icon);const n=items.filter(i=>i.app===a).length;
      chip(a,filter.type==='app'&&filter.app===a,'',(w?`<img src="${w.icon}" alt="">`:'')+esc(a)+` <span class="cnt">${n}</span>`,()=>{filter={type:'app',app:a};render();});});

    $('appList').innerHTML=apps.map(a=>`<option value="${esc(a)}">`).join('');
    $('crumbFilter').textContent = filter.type==='pop'?'Pop':filter.type==='all'?'All':filter.app;
    $('stat').textContent = `${items.length} interaction${items.length===1?'':'s'} · ${apps.length} app${apps.length===1?'':'s'}`;

    order=orderedItems(); lbIndex=currentLB?order.findIndex(i=>i.id===currentLB.id):-1;
    grid.innerHTML='';
    if(!order.length){
      const e=document.createElement('div');e.className='empty';
      e.innerHTML=`<h2>Nothing here yet</h2><p>${isOwner?'Hit “Add interaction” to document your first one.':'The owner hasn’t added anything to this view yet.'}</p>`;
      grid.appendChild(e); return;
    }
    order.forEach(item=>{
      const liked=likedSet.has(item.id);
      const iconHTML=item.icon?`<img src="${item.icon}" alt="">`:`<span class="fallback">${esc(initial(item.app))}</span>`;
      const cell=document.createElement('div');cell.className='cell';
      cell.innerHTML=`
        <div class="stage">
          <div class="phone"><div class="island"></div>
            <video src="${item.video}" muted loop playsinline preload="metadata"></video></div>
          <div class="hoverplay">${IC.play}</div>
        </div>
        <div class="cellfoot">
          <div class="cf-app">${iconHTML}${esc(item.app)}</div>
          <div class="cf-title"><span>${esc(item.title)}</span>
            <span class="cf-like${liked?' liked':''}">${IC.heart}${item.likes}</span></div>
        </div>`;
      const stage=cell.querySelector('.stage'), video=cell.querySelector('video');
      stage.onmouseenter=()=>{stage.classList.add('previewing');video.play().catch(()=>{});};
      stage.onmouseleave=()=>{stage.classList.remove('previewing');video.pause();video.currentTime=0;};
      stage.onclick=()=>openLightbox(item);
      cell.querySelector('.cf-like').onclick=e=>{e.stopPropagation();toggleLike(item);};
      grid.appendChild(cell);
    });
  }

  /* ---- player ---- */
  const V=$('lbVideo');
  let speeds=[1,0.5,1.5,2], si=0, looping=false;
  function fmtTimes(){$('pTime').textContent=`${t2(V.currentTime)} / ${t2(V.duration||0)}`;}
  V.addEventListener('timeupdate',()=>{ if(V.duration) $('pScrub').value=(V.currentTime/V.duration)*1000; fmtTimes(); });
  V.addEventListener('loadedmetadata',fmtTimes);
  V.addEventListener('ended',()=>{ if(!looping){$('pPlay').innerHTML=IC.play;} });
  V.addEventListener('play',()=>$('pPlay').innerHTML=IC.pause);
  V.addEventListener('pause',()=>$('pPlay').innerHTML=IC.play);
  $('pScrub').addEventListener('input',e=>{ if(V.duration) V.currentTime=(e.target.value/1000)*V.duration; });
  $('pPlay').onclick=()=>{ V.paused?V.play():V.pause(); };
  $('pMute').onclick=()=>{ V.muted=!V.muted; $('pMute').innerHTML=V.muted?IC.mute:IC.vol; if(!V.muted&&V.volume===0){V.volume=1;$('pVol').value=1;} };
  $('pVol').addEventListener('input',e=>{ V.volume=+e.target.value; V.muted=(+e.target.value===0); $('pMute').innerHTML=V.muted?IC.mute:IC.vol; });
  $('pSpeed').onclick=()=>{ si=(si+1)%speeds.length; V.playbackRate=speeds[si]; $('pSpeed').textContent=speeds[si]+'×'; $('pSpeed').classList.toggle('on',speeds[si]!==1); };
  $('pLoop').onclick=()=>{ looping=!looping; V.loop=looping; $('pLoop').classList.toggle('on',looping); toast(looping?'Loop on':'Loop off'); };
  $('pFull').onclick=()=>{ const el=$('playerStage'); if(!document.fullscreenElement) el.requestFullscreen?.().catch(()=>{}); else document.exitFullscreen?.(); };

  function paintLikeBtn(item){
    const liked=likedSet.has(item.id);
    $('lbLike').classList.toggle('liked',liked);
    $('lbLikeCount').textContent=item.likes;
  }
  function openLightbox(item){
    currentLB=item; lbIndex=order.findIndex(i=>i.id===item.id);
    document.querySelectorAll('.grid video').forEach(v=>v.pause());
    V.src=item.video; V.currentTime=0; V.loop=looping; V.playbackRate=speeds[si]; V.muted=false; V.volume=+$('pVol').value;
    $('pMute').innerHTML=V.muted?IC.mute:IC.vol;
    $('lbApp').innerHTML=(item.icon?`<img src="${item.icon}" alt="">`:`<span class="fallback">${esc(initial(item.app))}</span>`)+`<span>${esc(item.app)}</span>`;
    $('lbTitle').textContent=item.title;
    $('lbMeta').innerHTML=`${t2(item.duration||0)} runtime<br>added ${new Date(item.createdAt).toLocaleDateString()}`;
    paintLikeBtn(item);
    $('lightbox').classList.add('open');
    history.replaceState(null,'',`?i=${item.id}`);
    V.play().catch(()=>{});
    updateNav();
  }
  function updateNav(){ $('lbPrev').style.display=lbIndex>0?'flex':'none'; $('lbNext').style.display=(lbIndex>=0&&lbIndex<order.length-1)?'flex':'none'; }
  function step(d){ const n=lbIndex+d; if(n<0||n>=order.length) return; openLightbox(order[n]); }
  function closeLightbox(){ V.pause();V.removeAttribute('src');V.load(); $('lightbox').classList.remove('open'); currentLB=null; history.replaceState(null,'',location.pathname); }
  $('lbClose').onclick=closeLightbox;
  $('lbPrev').onclick=()=>step(-1); $('lbNext').onclick=()=>step(1);
  $('lightbox').onclick=e=>{ if(e.target===$('lightbox')) closeLightbox(); };
  $('lbLike').onclick=()=>{ if(currentLB) toggleLike(currentLB); };
  $('lbCopy').onclick=async()=>{ if(!currentLB)return; const url=location.origin+location.pathname+'?i='+currentLB.id; try{await navigator.clipboard.writeText(url);toast('Link copied');}catch(e){toast(url);} };
  $('lbDelete').onclick=async()=>{ if(!currentLB||!isOwner)return; if(!confirm(`Delete “${currentLB.title}”?`))return;
    const it=currentLB; const {error}=await supabase.from('interactions').delete().eq('id',it.id);
    if(error){toast('Delete failed: '+error.message);return;}
    if(it.video_path) await supabase.storage.from(BUCKET).remove([it.video_path]);
    items=items.filter(x=>x.id!==it.id); closeLightbox(); render(); toast('Deleted'); };
  $('lbEdit').onclick=()=>{ if(!currentLB||!isOwner)return; openUpload(currentLB); };

  document.addEventListener('keydown',e=>{
    if($('lightbox').classList.contains('open')){
      if(e.key==='Escape') closeLightbox();
      else if(e.key===' '){e.preventDefault(); V.paused?V.play():V.pause();}
      else if(e.key==='ArrowRight' && !e.shiftKey) V.currentTime=Math.min((V.duration||0),V.currentTime+5);
      else if(e.key==='ArrowLeft' && !e.shiftKey) V.currentTime=Math.max(0,V.currentTime-5);
      else if(e.key==='ArrowRight' && e.shiftKey) step(1);
      else if(e.key==='ArrowLeft' && e.shiftKey) step(-1);
      else if(e.key.toLowerCase()==='f') $('pFull').click();
      else if(e.key.toLowerCase()==='m') $('pMute').click();
    } else if(e.key==='Escape'){ $('uploadOverlay').classList.remove('open'); $('authOverlay').classList.remove('open'); }
  });

  /* ---- upload / edit ---- */
  let pendingIcon=null, pendingVideo=null;
  function openUpload(edit){
    editingId = edit?edit.id:null;
    $('uploadTitle').textContent = edit?'Edit interaction':'Add interaction';
    $('uploadSub').textContent = edit?'Update the details. (The video itself stays the same.)':'Documented for the whole directory to see.';
    $('fTitle').value = edit?edit.title:''; $('fApp').value = edit?edit.app:'';
    pendingIcon = edit?edit.icon:null; pendingVideo=null;
    $('iconThumb').innerHTML = edit&&edit.icon?`<img src="${edit.icon}" alt="">`:'🖼️';
    $('iconName').textContent = edit&&edit.icon?'Current icon':'Choose an image';
    $('videoThumb').innerHTML='🎬'; $('videoName').textContent = edit?'Kept as-is':'Choose a video';
    $('videoField').style.display = edit?'none':'block';
    $('prog').classList.remove('show'); $('prog').querySelector('i').style.width='20%';
    $('saveBtn').textContent = edit?'Save changes':'Save';
    $('uploadOverlay').classList.add('open'); $('fTitle').focus();
  }
  function closeUpload(){ $('uploadOverlay').classList.remove('open'); editingId=null; }
  $('addBtn').onclick=()=>openUpload(null);
  $('cancelUpload').onclick=closeUpload;
  $('uploadOverlay').onclick=e=>{ if(e.target===$('uploadOverlay')) closeUpload(); };
  function wireDrop(el,fn){el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('dragover');});el.addEventListener('dragleave',()=>el.classList.remove('dragover'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('dragover');const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)fn(f);});}
  $('iconDrop').onclick=()=>$('fIcon').click();
  $('fIcon').onchange=e=>{const f=e.target.files[0];if(f)setIcon(f);};
  wireDrop($('iconDrop'),setIcon);
  async function setIcon(f){ if(!f.type.startsWith('image/')){toast('Icon must be an image');return;} pendingIcon=await resizeIcon(f); if(pendingIcon){$('iconThumb').innerHTML=`<img src="${pendingIcon}" alt="">`;$('iconName').textContent=f.name;} }
  $('videoDrop').onclick=()=>$('fVideo').click();
  $('fVideo').onchange=e=>{const f=e.target.files[0];if(f)setVideo(f);};
  wireDrop($('videoDrop'),setVideo);
  function setVideo(f){ if(!f.type.startsWith('video/')){toast('Choose a video file');return;} const mb=f.size/1048576; if(mb>MAX_MB){toast(`${mb.toFixed(1)} MB — over the ${MAX_MB} MB limit`);return;} pendingVideo=f; $('videoName').textContent=f.name; $('videoHint').textContent=mb.toFixed(1)+' MB'; $('videoThumb').innerHTML=`<video src="${URL.createObjectURL(f)}" muted></video>`; }

  $('saveBtn').onclick=async()=>{
    if(!isOwner){toast('Sign in as owner first');return;}
    const title=$('fTitle').value.trim(), appName=$('fApp').value.trim();
    if(!appName){toast('App name required');return;}
    const btn=$('saveBtn'); btn.disabled=true;
    try{
      if(editingId){
        btn.textContent='Saving…';
        const { error } = await supabase.from('interactions').update({title:title||appName+' interaction',app:appName,icon:pendingIcon}).eq('id',editingId);
        if(error) throw error;
        const it=items.find(x=>x.id===editingId); if(it){it.title=title||appName+' interaction';it.app=appName;it.icon=pendingIcon;}
        closeUpload(); render(); if(currentLB&&currentLB.id===editingId){ $('lbTitle').textContent=it.title; $('lbApp').innerHTML=(it.icon?`<img src="${it.icon}">`:`<span class="fallback">${esc(initial(it.app))}</span>`)+`<span>${esc(it.app)}</span>`; } toast('Saved');
      } else {
        if(!pendingVideo){toast('Choose a recording');btn.disabled=false;btn.textContent='Save';return;}
        btn.textContent='Uploading…'; const prog=$('prog'),bar=prog.querySelector('i'); prog.classList.add('show'); bar.style.width='30%';
        const ext=(pendingVideo.name.split('.').pop()||'mp4').toLowerCase();
        const id=(crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random());
        const path=`videos/${id}.${ext}`; bar.style.width='50%';
        const { error:upErr }=await supabase.storage.from(BUCKET).upload(path,pendingVideo,{contentType:pendingVideo.type,upsert:false});
        if(upErr) throw upErr; bar.style.width='78%';
        const { data:{ publicUrl } }=supabase.storage.from(BUCKET).getPublicUrl(path);
        const duration=await probeDur(publicUrl);
        const row={id,title:title||appName+' interaction',app:appName,icon:pendingIcon,video_url:publicUrl,video_path:path,duration,likes:0};
        const { error:insErr }=await supabase.from('interactions').insert(row);
        if(insErr){ await supabase.storage.from(BUCKET).remove([path]); throw insErr; }
        bar.style.width='100%';
        items.unshift({...row,video:publicUrl,createdAt:Date.now()});
        closeUpload(); render(); toast('Added to the directory');
      }
    }catch(e){ toast('Failed: '+(e.message||e)); }
    finally{ btn.disabled=false; btn.textContent=editingId?'Save changes':'Save'; }
  };

  supabase.auth.onAuthStateChange(()=>refreshAuth());
  refreshAuth().then(load);
}
</script>
</body>
</html>
